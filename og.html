<!doctype html>
<!-- Gera public/img/og.png (1200x630): node <skill landing-page>/scripts/make_og.js . — não vai ao ar (fora de public/). -->
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Saira Condensed"; font-weight: 800; src: url("public/fonts/saira-condensed-latin-800-normal.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-weight: 500; src: url("public/fonts/ibm-plex-sans-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("public/fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2"); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { box-sizing: border-box; background: #fff; border-top: 18px solid #FE3130; display: grid; grid-template-columns: 1.5fr 1fr; align-items: center; gap: 24px; padding: 0 72px; font-family: "IBM Plex Sans", sans-serif; color: #141414; }
  .eyebrow { font: 500 20px/1 "IBM Plex Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: #D91F1E; margin: 0 0 18px; }
  h1 { font: 800 76px/.94 "Saira Condensed", sans-serif; text-transform: uppercase; margin: 0; }
  h1 span { color: #FE3130; }
  p { font-size: 26px; line-height: 1.3; color: #555250; margin: 20px 0 0; }
  .url { font: 500 22px/1 "IBM Plex Mono", monospace; color: #141414; margin-top: 22px; }
  img { width: 100%; height: auto; }
</style></head>
<body>
  <div>
    <div class="eyebrow">Newsletter semanal · grátis</div>
    <h1>IA que trabalha pro seu negócio. <span>Pronta pra usar.</span></h1>
    <p>Um email por semana, com um pedido pronto pra copiar.</p>
    <div class="url">mybusiness.ia.br</div>
  </div>
  <img src="public/img/logo-arco.png" alt="">
</body></html>
