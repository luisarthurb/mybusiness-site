<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sair da newsletter · mybusiness</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/png" href="img/logo-arco.png">
  <!-- Fontes no próprio site (mesmo padrão do curso): as 2 do topo são pré-carregadas. -->
  <link rel="preload" as="font" type="font/woff2" href="/fonts/saira-condensed-latin-800-normal.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/fonts/ibm-plex-sans-latin-400-normal.woff2" crossorigin>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/" aria-label="mybusiness, início"><span class="wordmark">MYBUSINESS</span></a>
    </div>
  </header>

  <main class="doc">
    <div class="wrap">
      <p class="eyebrow">Newsletter</p>
      <h1>Sair da lista</h1>
      <!-- Exige clique: antivírus de email abrem links sozinhos e não podem descadastrar ninguém. -->
      <div class="unsub-box" id="unsub">
        <p id="unsub-text">Clique no botão pra parar de receber a newsletter da mybusiness.</p>
        <button class="btn btn-primary" id="unsub-btn" type="button">Confirmar saída</button>
        <p class="msg" id="unsub-msg" role="status"></p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <a href="/">← Voltar</a>
      <a href="privacidade">Privacidade</a>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="sair.js"></script>
</body>
</html>
